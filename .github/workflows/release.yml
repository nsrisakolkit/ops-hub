name: Release Workflow

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  
jobs:
  # Job 1: Version and Tag
  version:
    name: Version and Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
      - name: Bump version
        id: version
        run: |
          cd backend
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            npm version ${{ github.event.inputs.version }} --no-git-tag-version
          else
            npm version patch --no-git-tag-version
          fi
          
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          
          # Update frontend version to match
          cd ../frontend
          npm version $VERSION --no-git-tag-version
          
      - name: Commit version changes
        if: github.event_name == 'workflow_dispatch'
        run: |
          git add backend/package.json frontend/package.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git tag ${{ steps.version.outputs.tag }}
          git push origin main
          git push origin ${{ steps.version.outputs.tag }}

  # Job 2: Build Release Artifacts
  build-release:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    needs: version
    
    strategy:
      matrix:
        app: [backend, frontend]
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
          
      - name: Install dependencies
        working-directory: ./${{ matrix.app }}
        run: npm ci
        
      - name: Generate Prisma client (backend only)
        if: matrix.app == 'backend'
        working-directory: ./backend
        run: npx prisma generate
        
      - name: Build for production
        working-directory: ./${{ matrix.app }}
        env:
          NODE_ENV: production
        run: npm run build
        
      - name: Create release package
        working-directory: ./${{ matrix.app }}
        run: |
          mkdir -p release
          
          if [ "${{ matrix.app }}" = "backend" ]; then
            cp -r dist/ release/
            cp package.json package-lock.json release/
            cp -r prisma/ release/
            cp -r node_modules/.prisma/ release/ || true
          else
            cp -r .next/ release/
            cp -r public/ release/
            cp package.json package-lock.json release/
          fi
          
          tar -czf ${{ matrix.app }}-${{ needs.version.outputs.version }}.tar.gz -C release .
          
      - name: Upload release artifacts
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.app }}-release
          path: ${{ matrix.app }}/${{ matrix.app }}-${{ needs.version.outputs.version }}.tar.gz

  # Job 3: Build and Push Docker Images
  docker-release:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [version, build-release]
    
    strategy:
      matrix:
        app: [backend, frontend]
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.app }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=${{ needs.version.outputs.tag }}
            
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.version.outputs.version }}

  # Job 4: Security Scan Release Images
  security-scan:
    name: Security Scan Release Images
    runs-on: ubuntu-latest
    needs: [version, docker-release]
    
    strategy:
      matrix:
        app: [backend, frontend]
        
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.app }}:${{ needs.version.outputs.version }}
          format: 'sarif'
          output: 'trivy-results-${{ matrix.app }}.sarif'
          
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results-${{ matrix.app }}.sarif'

  # Job 5: Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [version, docker-release, security-scan]
    environment: staging
    
    steps:
      - name: Deploy to staging
        run: |
          echo "Deploying version ${{ needs.version.outputs.version }} to staging..."
          # Add your staging deployment commands here
          
      - name: Run smoke tests
        run: |
          echo "Running smoke tests on staging..."
          # Add smoke test commands here
          
      - name: Notify staging deployment
        run: |
          echo "✅ Staging deployment successful for ${{ needs.version.outputs.version }}"

  # Job 6: Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [version, deploy-staging]
    environment: production
    
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v3
        with:
          name: backend-release
          
      - name: Download frontend artifacts
        uses: actions/download-artifact@v3
        with:
          name: frontend-release
          
      - name: Deploy to production
        run: |
          echo "Deploying version ${{ needs.version.outputs.version }} to production..."
          # Add your production deployment commands here
          
      - name: Health check
        run: |
          echo "Running health checks..."
          # Add health check commands here
          
      - name: Notify production deployment
        run: |
          echo "🚀 Production deployment successful for ${{ needs.version.outputs.version }}"

  # Job 7: Create GitHub Release
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [version, deploy-production]
    if: github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download release artifacts
        uses: actions/download-artifact@v3
        
      - name: Generate changelog
        id: changelog
        run: |
          # Generate changelog from git commits or use a changelog tool
          CHANGELOG=$(git log --pretty=format:"- %s" $(git describe --tags --abbrev=0)..HEAD)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          release_name: Release ${{ needs.version.outputs.version }}
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.changelog }}
            
            ## Docker Images
            - Backend: `${{ env.REGISTRY }}/${{ github.repository }}-backend:${{ needs.version.outputs.version }}`
            - Frontend: `${{ env.REGISTRY }}/${{ github.repository }}-frontend:${{ needs.version.outputs.version }}`
            
            ## Deployment
            - Staging: ✅ Deployed
            - Production: ✅ Deployed
          draft: false
          prerelease: false
          
      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./backend-release/backend-${{ needs.version.outputs.version }}.tar.gz
          asset_name: backend-${{ needs.version.outputs.version }}.tar.gz
          asset_content_type: application/gzip

  # Job 8: Post-deployment Tasks
  post-deployment:
    name: Post-deployment Tasks
    runs-on: ubuntu-latest
    needs: [version, deploy-production]
    
    steps:
      - name: Update documentation
        run: |
          echo "Updating documentation for version ${{ needs.version.outputs.version }}..."
          # Add documentation update commands here
          
      - name: Notify team
        run: |
          echo "Notifying team about release ${{ needs.version.outputs.version }}..."
          # Add team notification logic here (Slack, Discord, Email, etc.)
          
      - name: Update monitoring dashboards
        run: |
          echo "Updating monitoring dashboards..."
          # Add monitoring update commands here