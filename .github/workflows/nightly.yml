name: Nightly Tests

on:
  schedule:
    # Run every night at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  
jobs:
  # Job 1: Extended Integration Tests
  extended-integration-tests:
    name: Extended Integration Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: opshub_integration
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
          
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
        
      - name: Setup test environment
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opshub_integration
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-nightly
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-nightly
        run: |
          npx prisma generate
          npx prisma db push
          npm run db:seed
          
      - name: Run extended integration tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opshub_integration
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-nightly
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-nightly
          NODE_ENV: test
        run: |
          # Run all tests with extended timeout
          npm run test:e2e -- --testTimeout=30000 --verbose
          
      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: nightly-integration-results
          path: backend/test-results/

  # Job 2: Performance Tests
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: opshub_performance
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
          
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
        
      - name: Setup performance test environment
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opshub_performance
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-perf
        run: |
          npx prisma generate
          npx prisma db push
          # Generate large dataset for performance testing
          npm run db:seed:large
          
      - name: Start application
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opshub_performance
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-perf
          NODE_ENV: production
        run: |
          npm run build
          npm run start:prod &
          sleep 10
          
      - name: Install K6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
          
      - name: Run performance tests
        run: |
          cat > performance-test.js << 'EOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';
          
          export let options = {
            stages: [
              { duration: '30s', target: 20 },
              { duration: '1m', target: 20 },
              { duration: '20s', target: 0 },
            ],
          };
          
          export default function () {
            // Test authentication
            let authRes = http.post('http://localhost:3000/auth/login', JSON.stringify({
              email: 'admin@opshub.com',
              password: 'password123'
            }), {
              headers: { 'Content-Type': 'application/json' },
            });
            
            check(authRes, {
              'auth status is 200': (r) => r.status === 200,
              'auth response time < 500ms': (r) => r.timings.duration < 500,
            });
            
            if (authRes.status === 200) {
              let token = JSON.parse(authRes.body).accessToken;
              
              // Test users endpoint
              let usersRes = http.get('http://localhost:3000/users', {
                headers: { 'Authorization': `Bearer ${token}` },
              });
              
              check(usersRes, {
                'users status is 200': (r) => r.status === 200,
                'users response time < 1000ms': (r) => r.timings.duration < 1000,
              });
              
              // Test projects endpoint
              let projectsRes = http.get('http://localhost:3000/projects', {
                headers: { 'Authorization': `Bearer ${token}` },
              });
              
              check(projectsRes, {
                'projects status is 200': (r) => r.status === 200,
                'projects response time < 1000ms': (r) => r.timings.duration < 1000,
              });
            }
            
            sleep(1);
          }
          EOF
          
          k6 run performance-test.js
          
      - name: Upload performance results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: performance-test-results
          path: performance-results/

  # Job 3: Load Tests
  load-tests:
    name: Load Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Run Artillery load tests
        run: |
          npm install -g artillery
          
          cat > load-test.yml << 'EOF'
          config:
            target: 'http://localhost:3000'
            phases:
              - duration: 60
                arrivalRate: 5
              - duration: 120
                arrivalRate: 10
              - duration: 60
                arrivalRate: 20
            processor: "./auth-processor.js"
          
          scenarios:
            - name: "Authentication flow"
              weight: 40
              flow:
                - post:
                    url: "/auth/login"
                    json:
                      email: "admin@opshub.com"
                      password: "password123"
                    capture:
                      - json: "$.accessToken"
                        as: "token"
                - get:
                    url: "/users/me"
                    headers:
                      Authorization: "Bearer {{ token }}"
            
            - name: "CRUD operations"
              weight: 60
              flow:
                - function: "authenticate"
                - get:
                    url: "/projects"
                    headers:
                      Authorization: "Bearer {{ token }}"
                - get:
                    url: "/tasks"
                    headers:
                      Authorization: "Bearer {{ token }}"
          EOF
          
          # Note: This would need the application running
          echo "Load test configuration created"

  # Job 4: Database Migration Tests
  migration-tests:
    name: Database Migration Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: opshub_migration
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
          
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
        
      - name: Test fresh migration
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opshub_migration
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npx prisma db seed
          
      - name: Test migration rollback and reapply
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opshub_migration
        run: |
          echo "Testing migration stability..."
          # Add migration rollback/reapply tests here

  # Job 5: Security Audit
  security-audit:
    name: Nightly Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Install dependencies
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci
          
      - name: Run security audit
        run: |
          echo "Backend security audit:"
          cd backend && npm audit --audit-level=low
          
          echo "Frontend security audit:"
          cd ../frontend && npm audit --audit-level=low
          
      - name: Run OWASP dependency check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'ops-hub'
          path: '.'
          format: 'HTML'
          
      - name: Upload security report
        uses: actions/upload-artifact@v3
        with:
          name: security-audit-report
          path: reports/

  # Job 6: Dependency Updates Check
  dependency-updates:
    name: Check for Dependency Updates
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Check for outdated packages
        run: |
          echo "Backend outdated packages:"
          cd backend && npm outdated || true
          
          echo "Frontend outdated packages:"
          cd ../frontend && npm outdated || true
          
      - name: Generate update report
        run: |
          mkdir -p reports
          cd backend && npm outdated --json > ../reports/backend-outdated.json || true
          cd ../frontend && npm outdated --json > ../reports/frontend-outdated.json || true
          
      - name: Upload update report
        uses: actions/upload-artifact@v3
        with:
          name: dependency-updates-report
          path: reports/

  # Job 7: Notification
  notify-results:
    name: Notify Nightly Results
    runs-on: ubuntu-latest
    needs: [extended-integration-tests, performance-tests, migration-tests, security-audit, dependency-updates]
    if: always()
    
    steps:
      - name: Prepare notification
        run: |
          echo "Nightly test results:"
          echo "Integration Tests: ${{ needs.extended-integration-tests.result }}"
          echo "Performance Tests: ${{ needs.performance-tests.result }}"
          echo "Migration Tests: ${{ needs.migration-tests.result }}"
          echo "Security Audit: ${{ needs.security-audit.result }}"
          echo "Dependency Updates: ${{ needs.dependency-updates.result }}"
          
      - name: Send notification
        run: |
          # Add notification logic here (Slack, Discord, Email, etc.)
          echo "Notification sent about nightly test results"